version: "3.9"

services:
  app:
    build: .
    container_name: clinic-demo-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_DATABASE_URL: sqlite:////app/clinic.db
      APP_SECRET_KEY: dev-secret-key-change
      LLM_PROVIDER: mock
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
